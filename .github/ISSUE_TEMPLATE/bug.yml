name: 오류 보고
description: 재현 조건과 실제 결과를 기록합니다.
title: "[BUG] "
labels: [bug]
body:
  - type: textarea
    id: reproduce
    attributes:
      label: 재현 방법과 기대 결과
      description: 실제 계정·비밀번호·개인정보 대신 합성 데이터로 적어주세요.
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 실제 결과와 근거
      description: 오류 문구, 비식별 캡처, 실행 명령, 관련 검사 ID
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: 환경·빌드·모드
      placeholder: "commit / Chrome / Node / FIXTURE 또는 LIVE"
    validations:
      required: true
